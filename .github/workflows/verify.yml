name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Framework integrity
        run: python3 scripts/ufos.py check

      - name: Context budget
        run: python3 scripts/ufos.py budget
